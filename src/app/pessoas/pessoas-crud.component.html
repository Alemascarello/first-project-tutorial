<p-toast />
<p-confirmdialog />

<p-card styleClass="pessoas-card">
  <p-toolbar styleClass="pessoas-toolbar">
    <ng-template #start>
      <span class="pessoas-toolbar__titulo">Cadastro de Pessoas</span>
    </ng-template>

    <ng-template #end>
      <p-button label="Nova Pessoa" icon="pi pi-plus" (onClick)="abrirNovo()" />
    </ng-template>
  </p-toolbar>

  <p-table
    #tabela
    [value]="pessoas()"
    [paginator]="true"
    [rows]="5"
    [rowsPerPageOptions]="[5, 10, 20]"
    [globalFilterFields]="['nome', 'sexo']"
    [tableStyle]="{ 'min-width': '50rem' }"
    [stripedRows]="true"
    styleClass="pessoas-tabela"
  >
    <ng-template #caption>
      <div class="pessoas-tabela__filtro">
        <p-iconfield iconPosition="left">
          <p-inputicon styleClass="pi pi-search" />
          <input
            pInputText
            type="text"
            [(ngModel)]="filtroGlobal"
            (input)="tabela.filterGlobal(filtroGlobal, 'contains')"
            placeholder="Buscar por nome ou sexo"
          />
        </p-iconfield>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th pSortableColumn="nome">
          Nome
          <p-sortIcon field="nome" />
        </th>
        <th pSortableColumn="idade" style="width: 8rem">
          Idade
          <p-sortIcon field="idade" />
        </th>
        <th pSortableColumn="sexo" style="width: 10rem">
          Sexo
          <p-sortIcon field="sexo" />
        </th>
        <th pSortableColumn="dataNascimento" style="width: 12rem">
          Nascimento
          <p-sortIcon field="dataNascimento" />
        </th>
        <th style="width: 10rem">Ações</th>
      </tr>
    </ng-template>

    <ng-template #body let-pessoa>
      <tr>
        <td>{{ pessoa.nome }}</td>
        <td>{{ pessoa.idade }}</td>
        <td>
          <p-tag
            [value]="obterLabelSexo(pessoa.sexo)"
            [severity]="obterSeveridadeSexo(pessoa.sexo)"
          />
        </td>
        <td>{{ pessoa.dataNascimento | date : "dd/MM/yyyy" }}</td>
        <td>
          <div class="pessoas-acoes">
            <p-button
              icon="pi pi-pencil"
              [rounded]="true"
              [text]="true"
              severity="info"
              (onClick)="abrirEdicao(pessoa)"
            />
            <p-button
              icon="pi pi-trash"
              [rounded]="true"
              [text]="true"
              severity="danger"
              (onClick)="confirmarExclusao(pessoa)"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="5">Nenhuma pessoa cadastrada.</td>
      </tr>
    </ng-template>
  </p-table>
</p-card>

<p-dialog
  [(visible)]="dialogVisivel"
  [modal]="true"
  [style]="{ width: '32rem' }"
  [header]="modoEdicao ? 'Editar Pessoa' : 'Nova Pessoa'"
  [draggable]="false"
  [resizable]="false"
>
  <div class="pessoas-formulario">
    <p-floatlabel variant="on">
      <input pInputText id="nome" [(ngModel)]="formulario.nome" fluid />
      <label for="nome">Nome</label>
    </p-floatlabel>

    <p-floatlabel variant="on">
      <p-inputnumber
        inputId="idade"
        [(ngModel)]="formulario.idade"
        [min]="0"
        [max]="150"
        [useGrouping]="false"
        fluid
      />
      <label for="idade">Idade</label>
    </p-floatlabel>

    <p-floatlabel variant="on">
      <p-select
        inputId="sexo"
        [options]="sexoOpcoes"
        [(ngModel)]="formulario.sexo"
        optionLabel="label"
        optionValue="value"
        placeholder="Selecione"
        fluid
      />
      <label for="sexo">Sexo</label>
    </p-floatlabel>

    <p-floatlabel variant="on">
      <p-datepicker
        inputId="dataNascimento"
        [(ngModel)]="formulario.dataNascimento"
        dateFormat="dd/mm/yy"
        [showIcon]="true"
        [maxDate]="hoje"
        fluid
      />
      <label for="dataNascimento">Data de Nascimento</label>
    </p-floatlabel>
  </div>

  <ng-template #footer>
    <p-button
      label="Cancelar"
      severity="secondary"
      [text]="true"
      (onClick)="cancelar()"
    />
    <p-button
      [label]="modoEdicao ? 'Salvar' : 'Cadastrar'"
      icon="pi pi-check"
      (onClick)="salvar()"
      [disabled]="!formularioValido"
    />
  </ng-template>
</p-dialog>
