<div class="calculadora">
  <div class="telinha">{{ telinha }}</div>

  <div class="operadores">
    <button>off</button>
    <button>√</button>
    <button>%</button>
    <button>/</button>

    <button (click)="adicionaValor('7')">7</button>
    <button (click)="adicionaValor('8')">8</button>
    <button (click)="adicionaValor('9')">9</button>
    <button>x</button>

    <button (click)="adicionaValor('4')">4</button>
    <button (click)="adicionaValor('5')">5</button>
    <button (click)="adicionaValor('6')">6</button>
    <button>-</button>

    <button (click)="adicionaValor('1')">1</button>
    <button (click)="adicionaValor('2')">2</button>
    <button (click)="adicionaValor('3')">3</button>
    <button>+</button>

    <button (click)="adicionaValor('0')">0</button>
    <button>.</button>
    <button>=</button>
  </div>
</div>
